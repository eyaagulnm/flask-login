<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .container {
            background: white; padding: 40px; border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2); width: 100%; max-width: 400px;
            text-align: center;
        }
        h2 { color: #333; margin-bottom: 30px; font-size: 28px; }
        input { 
            width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #e1e5e9;
            border-radius: 8px; font-size: 16px;
        }
        input:focus { outline: none; border-color: #667eea; }
        button { 
            width: 100%; padding: 15px; background: linear-gradient(45deg, #667eea, #764ba2);
            color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer;
        }
        button:hover { transform: translateY(-2px); }
        p { margin-top: 20px; }
        a { color: #667eea; text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔐 Login</h2>
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <p>New user? <a href="/register">Register</a></p>
    </div>
</body>
</html>
